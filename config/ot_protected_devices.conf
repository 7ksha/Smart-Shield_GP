# SmartShield — OT Protected Devices Configuration
# =================================================
# List the IPs and CIDR ranges of ALL OT/ICS devices in your factory.
# Devices listed here will NEVER be auto-blocked by SmartShield's
# iptables blocking module.  Evidence (alerts) are still generated.
#
# The OT Detection module uses this list to:
#   1. Detect unauthorized access TO these devices (PLC, HMI, SCADA).
#   2. Suppress iptables blocking of these IPs (prevent factory downtime).
#   3. Tag evidence with [OT-SAFE] so analysts know blocking was suppressed.
#
# Format: one IP address or CIDR range per line.
#         Lines beginning with # are comments.
#         Trailing comments after the IP are ignored.
#
# ── EXAMPLE FACTORY NETWORK ─────────────────────────────────────────────────
# The Purdue Model (ISA-95) typically places OT devices in:
#   Level 0-1: Field devices, PLCs, RTUs       → 192.168.10.0/24
#   Level 2:   HMIs, Supervisory workstations  → 192.168.20.0/24
#   Level 3:   SCADA, Historians               → 192.168.30.0/24
#
# ── LEVEL 0-1: PLCs, RTUs, Field Controllers ────────────────────────────────
# 192.168.10.10   # PLC-01 Siemens S7-1200 (Assembly Line A)
# 192.168.10.11   # PLC-02 Siemens S7-1500 (Assembly Line B)
# 192.168.10.12   # PLC-03 Allen-Bradley (Conveyor)
# 192.168.10.20   # RTU-01 (Remote Terminal Unit, substation)
# 192.168.10.30   # VFD-01 Variable Frequency Drive
#
# ── LEVEL 2: HMIs, Engineering Workstations ─────────────────────────────────
# 192.168.20.10   # HMI-01 SCADA operator workstation
# 192.168.20.11   # HMI-02 Control room display
# 192.168.20.50   # EWS-01 Engineering workstation (Siemens TIA Portal)
#
# ── LEVEL 3: SCADA Servers, Historians ──────────────────────────────────────
# 192.168.30.10   # SCADA-Server-01
# 192.168.30.20   # Historian-01 OSIsoft PI
# 192.168.30.30   # OPC-UA Server
#
# ── ENTIRE OT SUBNETS (use CIDR to protect a whole segment) ─────────────────
# 192.168.10.0/24   # All field devices
# 192.168.20.0/24   # All HMIs and engineering workstations
# 192.168.30.0/24   # All SCADA / historian servers
#
# ── MODIFY THE SECTION BELOW FOR YOUR FACTORY ───────────────────────────────
# Replace these examples with your actual device IPs.
#
# 192.168.10.10
# 192.168.10.0/24
172.20.0.10   # Fake PLC-01
172.20.0.11   # Fake PLC-02
172.20.0.20   # Fake HMI
