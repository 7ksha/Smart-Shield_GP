# SmartShield — Authorized Modbus Masters
# =========================================
# List the IP addresses of hosts that are AUTHORIZED to send Modbus
# read/write commands to PLCs and other Modbus slaves.
#
# Any host NOT in this list that contacts a Modbus device (port 502)
# will generate an OT_UNAUTHORIZED_MODBUS_ACCESS alert.
#
# Leave this file empty to disable unauthorized-access detection
# (connections will still be counted for flood detection).
#
# Format: one IP per line. CIDR not supported — exact IPs only.
#
# ── EXAMPLES ────────────────────────────────────────────────────────────────
# 192.168.20.10   # HMI-01 (authorized SCADA operator workstation)
# 192.168.20.50   # EWS-01 (engineering workstation, TIA Portal)
# 192.168.30.10   # SCADA-Server-01 (authorized polling server)
#
# ── YOUR AUTHORIZED MASTERS ─────────────────────────────────────────────────
